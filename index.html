<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Healthcare marketplace experience survey">
  <title>Marketplace Experience Survey</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="survey-card" aria-labelledby="title">
      <header>
        <p class="eyebrow">Healthcare Marketplace</p>
        <h1 id="title">Experience Survey</h1>
        <p id="description">Share feedback about your healthcare marketplace experience.</p>
      </header>

      <form id="survey-form">
        <div class="field">
          <label id="name-label" for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" placeholder="Enter your name" required>
        </div>

        <div class="field">
          <label id="email-label" for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label id="number-label" for="number">Age</label>
          <input id="number" name="age" type="number" min="18" max="120" placeholder="18">
        </div>

        <div class="field">
          <label for="dropdown">Coverage type</label>
          <select id="dropdown" name="coverage" required>
            <option value="" disabled selected>Select coverage</option>
            <option value="marketplace">Marketplace plan</option>
            <option value="medicaid">Medicaid</option>
            <option value="medicare">Medicare</option>
            <option value="employer">Employer coverage</option>
            <option value="other">Other</option>
          </select>
        </div>

        <fieldset>
          <legend>How would you rate your experience?</legend>
          <label class="choice"><input name="rating" type="radio" value="excellent" required> Excellent</label>
          <label class="choice"><input name="rating" type="radio" value="good"> Good</label>
          <label class="choice"><input name="rating" type="radio" value="needs-improvement"> Needs improvement</label>
        </fieldset>

        <fieldset>
          <legend>Which areas did you use?</legend>
          <label class="choice"><input name="services" type="checkbox" value="plan-comparison"> Plan comparison</label>
          <label class="choice"><input name="services" type="checkbox" value="enrollment"> Enrollment</label>
          <label class="choice"><input name="services" type="checkbox" value="support"> Customer support</label>
        </fieldset>

        <div class="field">
          <label for="comments">Additional comments</label>
          <textarea id="comments" name="comments" rows="5" placeholder="Tell us more about your experience"></textarea>
        </div>

        <button id="submit" type="submit">Submit feedback</button>
      </form>
    </section>
  </main>
</body>
</html>
